name: Bug report
description: Report a reproducible problem with Zhixing
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, tokens, SecretStore data, private file contents, personal information, or unreviewed full logs.

        If this may be a security vulnerability, do not disclose exploit details here. Read the repository's [security policy](https://github.com/Tandem-Agents/zhixing/blob/main/SECURITY.md) for the current reporting status.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Briefly describe the problem and its user impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest sequence of commands or actions that reproduces the problem, using sanitized example data.
      placeholder: |
        1. Run ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include only the smallest sanitized error excerpt needed to identify the failure.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Give the Windows, Node.js, and Zhixing versions, and say whether this was an npm install or a source checkout.
      placeholder: Windows 11 x64; Node.js 24.x; Zhixing 0.1.0; source checkout
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional sanitized context
      description: Add only information necessary to reproduce or diagnose the issue. Do not upload full configuration or log files.
